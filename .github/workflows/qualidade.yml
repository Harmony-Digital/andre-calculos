name: Qualidade do portal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: node scripts/start-local.mjs
      - run: bash ../scripts/dev-env.sh npm run test:rls
      - run: bash ../scripts/dev-env.sh npm run test:e2e
      - name: Advisors locais
        run: |
          supabase db advisors --local --workdir .. --type security --level warn --fail-on error
          supabase db advisors --local --workdir .. --type performance --level warn --fail-on error
      - name: Encerrar Supabase local
        if: always()
        run: supabase stop --workdir .. --no-backup > /dev/null
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencias-de-testes
          path: app/test-results/
          retention-days: 7
