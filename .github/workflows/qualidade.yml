name: Qualidade do portal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Inventário sanitizado das dependências no build
        env:
          AUDIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AUDIT_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          mkdir -p ../.data/ci
          node ../scripts/inventariar-build.mjs > ../.data/ci/build-dependencies.json
      - uses: actions/upload-artifact@v4
        with:
          name: inventario-dependencias
          path: .data/ci/build-dependencies.json
          retention-days: 7

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: node scripts/start-local.mjs
      - run: bash ../scripts/dev-env.sh npm run test:rls
      - run: bash ../scripts/dev-env.sh npm run test:e2e -- --workers=1
      - name: Advisors locais
        run: |
          supabase db advisors --local --workdir .. --type security --level warn --fail-on error
          supabase db advisors --local --workdir .. --type performance --level warn --fail-on error
      - name: Encerrar Supabase local
        if: always()
        run: supabase stop --workdir .. --no-backup > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-de-testes
          # Somente capturas; não publicar cookies, traces ou estado de sessão.
          path: app/test-results/**/*.png
          retention-days: 7
